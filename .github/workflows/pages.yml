name: Deploy landing page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect public files
        working-directory: hoplontec-LandingPage
        run: |
          mkdir _site
          cp index.html brands.html company.html mission.html values.html careers.html contact.html navigation.js styles.css .nojekyll _site/
          cp -R assets _site/assets
          python3 scripts/version-assets.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hoplontec-LandingPage/_site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
